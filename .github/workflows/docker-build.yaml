name: Docker Build

on:
  workflow_call:
    inputs:
      image_name:
        description: Name of the final Docker image, not including the registry or tag
        type: string
        required: true
      tag_rules:
        description: Rules to be used to determine the tag for the Docker image. See the readme for https://github.com/docker/metadata-action for more information.
        type: string
        default: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value={{branch}}-{{sha}}-{{date 'YYYYMMDD-HHmmss' tz='America/St_Johns'}},enable={{is_default_branch}}
      dockerfile_path:
        description: Path to the Dockerfile to build.
        type: string
        default: Dockerfile
      target:
        description: The target build stage to build in the Dockerfile.
        type: string
        default: ""

permissions: {}

jobs:
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      attestations: write # Needed to create attestations
      contents: read # Needed to clone the repository
      id-token: write # Needed to sign attestations
      packages: write # Needed to push to GitHub Container Registry

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          cache-binary: false

      - name: Login to target registry
        uses: docker/login-action@v4.6.0
        with:
          # TODO: Support other registries
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        uses: docker/metadata-action@v6.2.0
        id: metadata
        with:
          images: ghcr.io/${{ inputs.image_name }}
          tags: ${{ inputs.tag_rules }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        id: push
        with:
          context: .
          file: "${{ inputs.dockerfile_path }}"
          push: true
          target: "${{ inputs.target }}"
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest@v4.2.2
        with:
          subject-name: ghcr.io/${{ inputs.image_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
