name: Earthly Build

on:
  workflow_call:
    inputs:
      target:
        description: The target to build in the Earthfile
        type: string
        default: +app

permissions: {}

jobs:
  earthly-build:
    name: Build Docker image with Earthly
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed to clone the repository
      packages: write # Needed to push to GitHub Container Registry

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Earthly
        uses: earthly/actions-setup@v1.0.13
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to target registry
        uses: docker/login-action@v4.6.0
        with:
          # TODO: Support other registries
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate sortable image tag
        id: image_tag
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          TIMESTAMP=$(TZ="America/St_Johns" date +"%Y%m%d-%H%M%S")
          TAG="${BRANCH}-${SHORT_SHA}-${TIMESTAMP}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & push with Earthly
        run: earthly --ci --push "$TARGET" --TAG="${IMAGE_TAG}"
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
          TARGET: ${{ inputs.target }}
